<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生產作業管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="生產作業管理">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0057b8">
<style>
  html,body{margin:0;height:100%;background:#0057b8;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  body{padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #app{display:block;width:100%;height:100%;border:0}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;transition:opacity .35s}
  #splash img{width:min(84vw,460px);height:auto}
  #splash.off{opacity:0;pointer-events:none}
  #slow{display:none;font-size:15px;color:#5b6f7b;text-align:center;padding:0 24px}
  #slow a{color:#1f5f93}
</style>
</head>
<body>
<div id="splash">
  <img src="splash.webp" alt="生產作業管理 WENS PRODUCTION OPS">
  <div id="slow">讀取比較久……<br>一直沒出現的話，<a id="direct" href="#" target="_blank" rel="noopener">點這裡直接打開</a></div>
</div>
<iframe id="app" title="生產作業管理" allow="camera; clipboard-write; screen-wake-lock"></iframe>
<script>
/*
 * 生產作業管理 App 外殼：手機「加入主畫面」後的圖示、名稱都來自這裡，打開後把首頁包在裡面（全螢幕，像 App）。
 * APP_URL：Apps Script 部署的網址（結尾 /exec）。換部署時只改這一行。
 */
const APP_URL = 'https://script.google.com/macros/s/AKfycbzRzQRdto4O0jiqS4Q_MYcZCwyvq6lI0yUfiTFFNrQtyN-b0Eg50k5K5n6bf4zv6YgthA/exec';

const frame = document.getElementById('app'), splash = document.getElementById('splash');
const base = APP_URL.split('?')[0];
document.getElementById('direct').href = APP_URL;
// 開場畫面：系統頁面真的出現（打招呼）才收起來；萬一沒打招呼，外框載入 4 秒後也收起來
const done = () => splash.classList.add('off');
frame.addEventListener('load', () => setTimeout(done, 4000));
frame.src = APP_URL;
setTimeout(() => { document.getElementById('slow').style.display = 'block'; }, 12000);

// 系統頁面打招呼 → 回應它「你在 App 裡」；之後點首頁、前台、後台，就在 App 裡換頁
window.addEventListener('message', e => {
  let host = '';
  try { host = new URL(e.origin).hostname; } catch (err) { return; }
  if (!/\.googleusercontent\.com$|\.google\.com$/.test(host)) return;
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.wens === 'hello' && e.source) { e.source.postMessage({wens: 'ack'}, '*'); done(); }
  if (d.wens === 'go') frame.src = APP_URL + (d.page ? '?page=' + encodeURIComponent(d.page) : '');
});
</script>
</body>
</html>
