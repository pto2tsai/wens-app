<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生產作業管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="生產作業管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#132b3a">
<style>
  html,body{margin:0;height:100%;background:#e6ecef;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  body{padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #app{display:block;width:100%;height:100%;border:0}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#132b3a;color:#fff;transition:opacity .3s}
  #splash img{width:112px;height:112px;border-radius:26px;background:#fff;padding:6px;box-sizing:border-box}
  #splash b{font-size:24px;letter-spacing:.06em}
  #splash small{font-size:13px;letter-spacing:.1em;opacity:.8}
  #splash small span{color:#5fc3ff}
  #splash.off{opacity:0;pointer-events:none}
  #slow{display:none;font-size:14px;opacity:.8;text-align:center;padding:0 24px}
  #slow a{color:#5fc3ff}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <b>生產作業管理</b>
  <small>WENS <span>PRODUCTION OPS</span></small>
  <div id="slow">讀取比較久……<br>一直沒出現的話，<a id="direct" href="#" target="_blank" rel="noopener">點這裡直接打開</a></div>
</div>
<iframe id="app" title="生產作業管理" allow="camera; clipboard-write; screen-wake-lock"></iframe>
<script>
/*
 * 生產作業管理 App 外殼：手機「加入主畫面」後的圖示、名稱都來自這裡，打開後把首頁包在裡面（全螢幕，像 App）。
 * APP_URL：Apps Script 部署的網址（結尾 /exec）。換部署時只改這一行。
 */
const APP_URL = 'https://script.google.com/macros/s/AKfycbyHm4nbH2zJLrZ9O8PrafwCdXgpab4fxafWK6ilRJ2zWpt5eIvwYYo1ELsmul5rIEGP/exec';

const frame = document.getElementById('app'), splash = document.getElementById('splash');
const base = APP_URL.split('?')[0];
document.getElementById('direct').href = APP_URL;
frame.addEventListener('load', () => splash.classList.add('off'));
frame.src = APP_URL;
setTimeout(() => { document.getElementById('slow').style.display = 'block'; }, 12000);

// 工具頁點了連結：同一個系統的就在 App 裡換頁；別的系統（例如 MES）另開視窗
window.addEventListener('message', e => {
  if (!/\.googleusercontent\.com$|\.google\.com$/.test(new URL(e.origin).hostname)) return;
  const d = e.data;
  if (!d || d.wens !== 'go' || typeof d.url !== 'string') return;
  if (d.url.split('?')[0] === base) frame.src = d.url;
  else window.open(d.url, '_blank', 'noopener');
});
</script>
</body>
</html>
